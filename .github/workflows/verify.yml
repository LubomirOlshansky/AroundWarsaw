# The verification set on every push to main and every pull request, on Linux with the same Godot
# as the Mac (4.7.2), in two jobs:
#   quick  the check scripts that need no map (steering, settings, tiers, the HUD, police, ...).
#   map    the map pack (tools/map_pack.py: lod2.bin, lod2.json, terrain.json, a release asset,
#          since loop 3d-1 took them out of git), the derived split and prebuilt sectors
#          (tools/setup_map.sh, with a software Vulkan renderer under Xvfb), then the map, road,
#          street, drape, drive, landmark and water checks and short game runs on both city paths.
# Screenshots, the bench, the long autopilot runs and the phone stay on the Mac's tools/verify.sh
# (docs/WORKFLOW.md).
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its older run; every push to main keeps its own run (one
# group per commit), so no merge is left without a verdict (2026-11-02: several main runs were
# cancelled by the next merge, and #261's red run went unseen).
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh (verify.sh is a zsh script)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot

      # Loop 3d-1: the GUGiK outputs (lod2.bin is 87 MB), the sector split and the prebuilt
      # sectors are derived and not in git; they need the raw downloads (tools/setup_map.sh
      # --full) and the prebuilt ones a renderer. So a clone here has no city to build: CI runs
      # the steps that need no map; the map, roads, drape, drive, landmarks and the game runs
      # stay on the Mac's tools/verify.sh. Loop MW-1: `places` reads only the committed
      # centrum.json and data/places.json, so it runs here too; loop MW-5: `sounds` too; loop
      # MW-6: `eggs` and `tape` too; loop MW-3: `crowds` too; loop MW-4: `life` too; loop jobs-2: `jobs2` too; DEMO 6.3: `rescues` too; loop couriers: `couriers` too; beta values: `delivery` and `laneassist` too; the museum and Plac loop: `sites` too; the L-shaped map loop: `edge` too; loop 3h slice 1: `save` and `districts` too; slice 2: `syrenki` too; slice 3: `ladder` too; the first-10 polish: `cassettes` too; the mesh-quality check: `meshq` too; the opening flyover: `opening` too; packs: `packs` too; wellness circles: `wellness` too; the fans by Stadion Leguminy: `fans` too; the gamepad loop: `gamepad` too; the roofs lane: `roofdress,tenementtrim,osmroofs` too; `parkdetails`, `streetdetails` and `stops` (Python on the committed centrum.json; the bake stamps went stale unseen while they sat only in the skipped map job, 2026-11-02) too.
      - name: tools/verify.sh, the steps that need no map
        env:
          GODOT: /home/runner/godot/godot
          NW_MAP_PACK: "off"   # the map job fetches and builds the map; this one stays map-free
        run: zsh tools/verify.sh --only=parkdetails,streetdetails,smooth,fixes,streetpass,models,overrides,stops,spec,steering,laneassist,stuckoffer,handling,settings,credits,tiers,governor,heliview,hud,places,edge,eggs,tape,crowds,life,buses,crashes,rave,boatrace,evtow,loud,crazy,oldtram,packs,wellness,fans,garage,save,districts,syrenki,cassettes,ladder,first10,chatter,endcard,opening,parodies,jobs2,rescues,couriers,delivery,rides,roofdress,tenementtrim,osmroofs,sites,meshq,sfx,juice,gamepad,radio,sounds,police --logs="$RUNNER_TEMP/verify"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: ${{ runner.temp }}/verify
          retention-days: 14

  # Two halves in parallel. "data and roads" grew to ~45 min on a runner with the prebuilt city (2026-11-07), so 75.
  map:
    name: map (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: data and roads
            steps: map,roads,streets,outline,pois,streetmesh,lod2,courts,drape,drive,drive-prebuilt,deckxray,stuckspots,stuckspots-prebuilt,lanedrive,finite,questlines,stopassist,language,cost,oldtownroofs,water-prebuilt,prebuilt
          - part: landmarks, water and runs
            steps: landmarks,water,plain,ram,teleport
    steps:
      - uses: actions/checkout@v4

      # zsh for the scripts, Xvfb and Mesa's lavapipe (software Vulkan): bake_city.gd needs a
      # renderer (--headless drops MultiMesh and texture data).
      - name: Install zsh, Xvfb and software Vulkan
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh xvfb mesa-vulkan-drivers

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot

      - name: Cache the map pack
        uses: actions/cache@v4
        with:
          path: build/map-pack
          key: map-pack-${{ hashFiles('tools/map_pack.json') }}

      # Exit 3: the pack tools/map_pack.json names is not published yet (a new pack's PR, before
      # its release asset is up): the map checks are skipped with a warning instead of failing.
      - name: Fetch the map pack
        id: pack
        run: |
          set +e
          python3 -I tools/map_pack.py fetch
          code=$?
          if [ $code -eq 3 ]; then
            echo "::warning title=Map pack not published::the map checks were skipped (tools/map_pack.py: publish the release asset)"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"; exit $code

      # The split and the prebuilt sectors from the last run whose inputs were the same; a stale
      # or missing set is rebuilt below (check_map_data.py --fresh compares the stamps).
      - name: Cache the derived map files
        if: steps.pack.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            game/map/index.json
            game/map/index.res
            game/map/proxies.scn
            game/map/sectors
            game/map/shared
          key: map-derived-${{ hashFiles('tools/map_pack.json', 'game/map/*.json', 'game/map/*.bin', 'tools/bake_sectors.py', 'game/tools/bake_city.gd', 'game/scripts/**', 'game/shaders/**', 'game/data/courts.json') }}
          restore-keys: map-derived-

      - name: The split and the prebuilt sectors (tools/setup_map.sh)
        if: steps.pack.outputs.ready == 'true'
        env:
          GODOT: /home/runner/godot/godot
        run: |
          mkdir -p build
          xvfb-run -a -s "-screen 0 1280x720x24" zsh tools/setup_map.sh --if-needed || { tail -30 build/setup_map.log; exit 1; }

      - name: tools/verify.sh, the map steps
        if: steps.pack.outputs.ready == 'true'
        env:
          GODOT: /home/runner/godot/godot
        run: zsh tools/verify.sh --only=${{ matrix.steps }} --logs="$RUNNER_TEMP/verify-map"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-map-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verify-map
          retention-days: 14
          if-no-files-found: ignore
