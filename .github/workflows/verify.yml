# The quick verification set (tools/verify.sh --quick) on every push to main and every pull
# request: map data, the road and street rules, the check scripts and the plain and prebuilt
# headless runs, on Linux with the same Godot as the Mac (4.7.2). What it can't check is the
# same as on the Mac: screenshots, the bench, the phone (docs/WORKFLOW.md, definition of done).
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh (verify.sh is a zsh script)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot

      - name: tools/verify.sh --quick
        env:
          GODOT: /home/runner/godot/godot
        run: zsh tools/verify.sh --quick --logs="$RUNNER_TEMP/verify"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: ${{ runner.temp }}/verify
          retention-days: 14
