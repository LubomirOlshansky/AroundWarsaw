# The verification steps that need no map, on every push to main and every pull request: the
# check scripts for steering, settings, tiers, the governor, the HUD, rides, sounds, radio and
# police, on Linux with the same Godot as the Mac (4.7.2). Since loop 3d-1 the map is not in
# git, so the map, road, drape and drive checks and the game runs stay on the Mac's
# tools/verify.sh, with screenshots, the bench and the phone (docs/WORKFLOW.md).
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh (verify.sh is a zsh script)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot

      # Loop 3d-1: the GUGiK outputs (lod2.bin is 87 MB), the sector split and the prebuilt
      # sectors are derived and not in git; they need the raw downloads (tools/setup_map.sh
      # --full) and the prebuilt ones a renderer. So a clone here has no city to build: CI runs
      # the steps that need no map; the map, roads, drape, drive, landmarks and the game runs
      # stay on the Mac's tools/verify.sh. Loop MW-1: `places` reads only the committed
      # centrum.json and data/places.json, so it runs here too; loop MW-5: `sounds` too; loop
      # MW-6: `eggs` and `tape` too; loop MW-3: `crowds` too; loop MW-4: `life` too; loop jobs-2: `jobs2` too; loop couriers: `couriers` too; the museum and Plac loop: `sites` too; the L-shaped map loop: `edge` too; loop 3h slice 1: `save` and `districts` too; slice 2: `syrenki` too; slice 3: `ladder` too; the first-10 polish: `cassettes` too; the mesh-quality check: `meshq` too; the opening flyover: `opening` too; packs: `packs` too; the gamepad loop: `gamepad` too.
      - name: tools/verify.sh, the steps that need no map
        env:
          GODOT: /home/runner/godot/godot
        run: zsh tools/verify.sh --only=steering,settings,tiers,governor,hud,places,edge,eggs,tape,crowds,life,buses,oldtram,packs,garage,save,districts,syrenki,cassettes,ladder,first10,endcard,opening,parodies,jobs2,couriers,rides,sites,meshq,sfx,juice,gamepad,radio,sounds,police --logs="$RUNNER_TEMP/verify"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: ${{ runner.temp }}/verify
          retention-days: 14
